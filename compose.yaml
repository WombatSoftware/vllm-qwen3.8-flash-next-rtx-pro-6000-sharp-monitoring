# Opinionated vLLM recipe: Qwen3.8-Flash-Next on a single RTX PRO 6000 Blackwell,
# with the Qwen-Sharp chat template and a local Prometheus + Grafana stack.
#
# Every non-obvious flag below is explained, and the numbers quoted come from
# docs/benchmarks.md (llama-benchy sweeps, 3 runs per cell). If you change a
# flag, re-run the sweep -- several of these interact -- and run it through
# ./scripts/bench-guard.sh: an unguarded sweep on a shared engine is
# uninterpretable (docs/benchmarks.md, "Benchmark isolation").
#
# Paths are configurable via .env (copy .env.example). MODELS_DIR must contain
# the checkpoint at $MODELS_DIR/dicksondickson/Qwen3.8-Flash-Next-NVFP4-reshard-mtp-fix.

services:
  qwen-3-8-flash-next:
    # Bare upstream nightly, pinned by its FULL-SHA tag. Nothing is built
    # locally any more: the one-function eagle-gate overlay this recipe used to
    # carry was retired once PR #55390 replaced the model-type gate with
    # positional draft-group annotation (README "Why a nightly").
    # A sha-addressed tag is immutable, so with pull_policy: never a compose
    # recreate can never silently move the base. Pull it once by hand (README
    # step 2).
    #
    # Re-pin rule when moving to a newer nightly: the base must contain
    # PR #59621. Check inside the image that
    #   grep -rn indexed_attention <site-packages>/vllm/models/qwen4_exp/
    # HITS. Bases between #57387 and #59621 (e.g. nightly-0cbac6cd, 2026-10-02)
    # die on every boot with `ValueError: Invalid layer_type indexed_attention`
    # before weight load (vllm#59756).
    #
    # Why a nightly and not the v0.30.0 release: v0.30.0 predates the fp8-QSA
    # sm_120 kernels (#55557), the hermes parser fix (#56635) and the
    # spec-decode correctness chain (#56734, #57885), all load-bearing here.
    image: vllm/vllm-openai:nightly-18f8f96025b556071eb627076f94df560fbd3a22
    pull_policy: never
    container_name: qwen-3-8-flash-next

    # restart: always + healthcheck does NOT restart on unhealthy, only on exit.
    # A real crash loop reloads the 47.7 GiB PLE table every cycle -- watch the
    # container restart count before assuming the engine is merely slow to boot.
    restart: always
    # vLLM's default is 10 s before SIGKILL; a recreate mid-generation would drop
    # in-flight agent turns. 60 s lets the scheduler drain.
    stop_grace_period: 60s
    shm_size: 16gb
    ipc: host
    ulimits:
      memlock: -1
    ports:
      - "${VLLM_BIND:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    environment:
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
      # Build JIT targets (FlashInfer, torch.compile) for Blackwell only instead
      # of the image's full arch list. 12.0f == sm_120 family (RTX PRO 6000).
      TORCH_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      # Kernel/compile caches persisted across container recreates. Without these
      # every `compose up` after an image change re-JITs FlashInfer and rebuilds
      # the torch.compile cache.
      - ${VLLM_CACHE_DIR:-~/.cache/vllm}:/root/.cache/vllm
      - ${TORCH_CACHE_DIR:-~/.cache/torch}:/root/.cache/torch
      - ${FLASHINFER_CACHE_DIR:-~/.cache/flashinfer}:/root/.cache/flashinfer
      # Checkpoint lives outside the HF hub cache (downloaded with --local-dir);
      # mounted read-only so the engine can never rewrite shards.
      - ${MODELS_DIR:-./models}:/models:ro
      - ./chat_template.jinja:/opt/vllm/chat_template.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold start (first ever boot, empty caches) can take ~30 min. A warm-cache
      # boot on this config measures about 150 s.
      start_period: 1800s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

    command: >
      /models/dicksondickson/Qwen3.8-Flash-Next-NVFP4-reshard-mtp-fix
      --served-model-name qwen-3-8-flash-next
      --port 8000 --host 0.0.0.0
      --quantization modelopt
      --engram-config '{"cpu_offload": true}'
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.96
      --enable-prefix-caching
      --max-num-seqs 12
      --max-num-batched-tokens 16384
      --long-prefill-token-threshold 8192
      --max-model-len 262144
      --kv-cache-dtype fp8
      --trust-remote-code
      --enable-auto-tool-choice
      --per-request-spec-decode-metrics summary
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
      --chat-template /opt/vllm/chat_template.jinja

    # ---------------------------------------------------------------------
    # Why these values (all measured -- see docs/benchmarks.md)
    #
    # --engram-config '{"cpu_offload": true}'
    #   Pins the 47.7 GiB FP8 PLE n-gram table in host RAM; the GPU reads rows
    #   over UVA on a side stream. Without it the checkpoint cannot load on a
    #   96 GB card. This is in-process, so there is no offload worker, no IPC
    #   socket, and no need for a forced mp executor or cap_add SYS_PTRACE.
    #   The table shows up as container memory, not as a separate process.
    #   This flag is the only switch: the VLLM_PLE_CPU_OFFLOAD env shim was
    #   deleted upstream (#57937) and VLLM_PLE_OFFLOAD_READY_TIMEOUT is gone.
    #
    # --gpu-memory-utilization 0.96
    #   With fp8 KV and the batch pair below, a healthy boot reports a
    #   341,041-token KV pool = 1.30x one max-length request. Anything that
    #   reserves more GPU memory still needs a boot check before you trust it.
    #   Known boot risk at 0.96: the first boot can lose a CUDA-OOM lottery in
    #   the fused-MoE autotune (seen once on nightly-ac68c308; the retry booted
    #   clean). restart: always masks it at the cost of one extra boot. If it
    #   ever loops, step down to 0.955 before touching anything else.
    #
    # --max-num-seqs 12
    #   The model card suggests 2 as a 96 GB precaution. That serialises 4-way
    #   concurrency into two slots and caps agent fan-out. KV lives in only a
    #   quarter of the layers, so the per-seq budget is cheap here.
    #
    # --max-num-batched-tokens 16384 / --long-prefill-token-threshold 8192
    #   The threshold is half the batch budget: it caps each prefill's per-step
    #   token count so a long prompt takes at most half a step and decodes
    #   interleave. This pair REFUSED TO BOOT with --kv-cache-dtype auto (5.61
    #   GiB of KV against the 7.41 GiB one 262144-token sequence needs); with
    #   fp8 KV it boots, and against 8192/4096 it measured +2.4-8.3% on every
    #   depth-c1 prefill row and +28-61% on mid-depth c4 decode. The price is
    #   pool: 341k tokens instead of 468k. That only matters for 4-way at 131k
    #   depth, which wants 524k and fit in neither.
    #   (--max-num-partial-prefills is a V0-era knob, gone from this CLI. Do
    #   not re-add it.)
    #
    # --speculative-config num_speculative_tokens 3
    #   MTP-3, not MTP-2. Measured mean acceptance length 2.695 and all three
    #   draft tokens accepted in 35.8% of verify steps -- the modal outcome.
    #   Worth +16% single-stream decode. It costs 10-35% on the concurrent
    #   context-load rows, so drop to 2 if 4-way fan-out matters more to you
    #   than single-stream latency. Removing spec-decode entirely costs 40% of
    #   single-stream decode but GAINS 47% on prefill (the draft head is pure
    #   overhead during prefill).
    #   The draft groups claim real KV pool, so the boot-line pool size is only
    #   comparable between boots with the same speculative config.
    #
    # --per-request-spec-decode-metrics summary
    #   Reports acceptance per request in the usage chunk. Its cost sits inside
    #   benchmark noise. It stays on because it is the cheapest proof that MTP
    #   is actually active: an engine that has silently lost its
    #   --speculative-config still boots, still answers, and still passes a
    #   tool-call smoke test. (Also check the init line for
    #   speculative_config=SpeculativeConfig(method='mtp', ...), not None.)
    #
    # FlashInfer autotune is ON (i.e. --no-enable-flashinfer-autotune is
    #   deliberately absent, despite being a model-card default). It is higher
    #   on 23 of 28 benchmark rows. It costs ~20-30 s of startup that RECURS
    #   every boot -- ~/.cache/flashinfer does not grow, so the tuning is redone
    #   per start rather than persisted.
    #
    # --kv-cache-dtype fp8
    #   Needs fp8_e4m3 KV on the QSA path (PR #55557). It moves the pool-bound
    #   cells hugely -- at 131k depth and 4-way, context decode 3.78 -> 13.20
    #   t/s and context prefill 6,244 -> 10,874 t/s -- and leaves single-stream
    #   decode within noise. It is not free: the QSA-compute-bound cells pay for
    #   the fp8 kernel (tg128 @ d32768 c4 363.7 -> 244.7 when first measured,
    #   ~274 now; pp2048 @ dN c1 down 20-36%). See docs/benchmarks.md.
    #
    # Keep --disable-log-stats OUT: it stops the stat loggers that feed the
    #   vllm:* Prometheus metrics the Grafana dashboard is built on.
    # ---------------------------------------------------------------------

  # Prometheus and Grafana publish on 127.0.0.1 by default, so they are reachable
  # only from the host running compose. To reach them from another machine either
  # tunnel:   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <gpu-host>
  # or set GRAFANA_BIND / PROMETHEUS_BIND to 0.0.0.0 in .env -- which exposes an
  # unauthenticated Prometheus and a password-only Grafana. Prefer the tunnel.
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    container_name: qwen-3-8-flash-next-prometheus
    restart: always
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # Datasource and dashboards are provisioned from ./monitoring/grafana, so
  # nothing has to be imported by hand. The dashboard's $model_name variable is
  # resolved from label_values(model_name), so renaming --served-model-name needs
  # no dashboard edit. Do not reintroduce hardcoded model_name literals into
  # panel queries; they silently show No-data on every rename.
  #
  # GRAFANA_ADMIN_PASSWORD only seeds the password when the grafana-data volume
  # is FIRST created. Rotating it later needs:
  #   docker exec qwen-3-8-flash-next-grafana grafana cli admin reset-admin-password '<new>'
  # Five failed logins then lock the account for five minutes, during which the
  # UI insists the password is wrong.
  grafana:
    image: docker.io/grafana/grafana:13.2.3
    container_name: qwen-3-8-flash-next-grafana
    restart: always
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vllm-qwen-3-8-flash-next.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  prometheus-data:
  grafana-data:
